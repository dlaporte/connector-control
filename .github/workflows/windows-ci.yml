# Build and test the Windows app on every push/PR that touches it. Sources/ConnectorControlCore
# is watched too: the Core tests assert Apple Foundation's JSON output byte for byte against
# the goldens under Tests/Fixtures, so a Mac serialization change must re-run them here.
name: Windows CI

on:
  push:
    branches: ['**']
    paths:
      - 'windows/**'
      - 'Tests/Fixtures/**'
      - 'Sources/ConnectorControlCore/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Tests/Fixtures/**'
      - 'Sources/ConnectorControlCore/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Restore
        run: dotnet restore windows/ConnectorControl.slnx

      - name: Build
        run: dotnet build windows/ConnectorControl.slnx --no-restore -c Release

      # ci.runsettings sets xUnit FailSkips, so a test that silently skips on the
      # runner (a Windows-only test that did not run) fails the build.
      - name: Test
        run: dotnet test windows/ConnectorControl.slnx --no-build -c Release --settings windows/ci.runsettings --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

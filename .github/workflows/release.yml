# Build, sign, and publish one Connector Control release - the Mac DMG with its
# Sparkle appcast AND the Windows installers - from a single version tag.
#
# Jobs:
#   prepare          (ubuntu)   version from the tag; CHANGELOG section -> notes.md (gate 1);
#                               the tagged commit is on master (gate 2)
#   mac-test         (macos-15) swift test; any failed or skipped test stops the run here
#                               (scripts/test-mac.sh)
#   mac              (macos-15) .github/workflows/mac-build.yml: build, sign, notarize, DMG,
#                               appcast -> artifact "mac-dmg-appcast". preview.yml calls the
#                               same file.
#   windows          (windows)  .github/workflows/windows-build.yml with require-signing: true -
#                               that file's own gate job proves all six Windows signing secrets
#                               exist (a release is never unsigned) before test, then matrix
#                               win-x64/win-arm64 publish + signed vpk pack -> "velopack-<rid>",
#                               then silent install + launch of the x64 package with the
#                               signature required and the arm64 Setup.exe signature checked.
#                               preview.yml calls the same file.
#   publish          (ubuntu)   the writer: creates the release WITH the DMG and appcast
#                               attached (so it is never "latest" without its feed), uploads the
#                               Windows assets (never overwriting a published one), verifies
#                               releases/latest and the served appcast (version, build,
#                               enclosure, EdDSA signature)
#   preview-feed     (ubuntu)   after publish: copies the release's appcast onto the Mac preview
#                               feed, so preview installs move on to this release. Allowed to
#                               fail without failing the release (see the job).
#
# Trigger: exact vX.Y.Z tags only (see below). workflow_dispatch runs everything EXCEPT
# publish and preview-feed - a rehearsal that cannot create a release (its version input names the
# CHANGELOG section and stamps the packages; the artifacts are the only output).
#
# Required secrets. The Mac set belongs in the "signing" GitHub Environment (Settings ▸
# Environments), which only mac-build.yml's job names: with required reviewers and a
# deployment branch policy on that environment, no job GitHub has not shown a human can read
# them. The Windows set stays a repository secret set: windows-build.yml's own gate job checks
# for it before the signed packaging jobs start (the unsigned test job runs in parallel), and a
# preview may be cut from any branch.
#   Mac (same names as the trailcache repo):
#   APPLE_CERTIFICATE          base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password for the .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: David LaPorte (TEAMID)"
#   APPLE_ID                   Apple ID email used for notarization
#   APPLE_PASSWORD             app-specific password for that Apple ID
#   APPLE_TEAM_ID              10-character team identifier
#   KEYCHAIN_PASSWORD          any string; protects the throwaway CI keychain
#   SPARKLE_ED_PRIVATE_KEY     EdDSA private key that signs the appcast (backup: login Keychain)
#   Windows (Azure Artifact Signing) - ALL SIX are required, and documented
#   once, with windows-build.yml's gate job:
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#   AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE

name: Release

on:
  push:
    tags:
      # Exact stable versions only - no trailing wildcard. A suffixed tag
      # (v1.3.0-beta1) must never build here: the release would be created
      # without --prerelease, become "latest", and its appcast would be
      # served from SUFeedURL to every auto-updating install.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, X.Y.Z (needs a "## vX.Y.Z" section in CHANGELOG.md). Nothing is published.'
        required: true
        type: string

# Read-only by default; only the publish and preview-feed jobs raise this to contents: write.
permissions:
  contents: read

# A rehearsal dispatch and a tag push must never build side by side; runs queue instead.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Version, notes, and gates
    # ubuntu-24.04 is pinned deliberately (as are the macos-15 and windows-2025 images used
    # elsewhere in this repo's workflows): a runner-image rollover is a deliberate version bump
    # here, not something that happens under a floating "-latest" label. Dependabot does not
    # manage these.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version
        id: derive
        run: |
          # A tag push is the real thing; a dispatch rehearses version X.Y.Z from the input.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::version input '$INPUT_VERSION' is not X.Y.Z"; exit 1; }
            TAG="v$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_EVENT_NAME -> $TAG (${TAG#v})"

      # First, before minutes of build/notarization: the changelog is the
      # single source for the GitHub release notes, the Sparkle update
      # dialog AND the Windows update dialog, and failing here enforces that
      # every release ships with one. --release also drops sub-headings with no
      # bullets and fails when nothing but sub-headings is left.
      - name: Extract changelog section
        env:
          TAG: ${{ steps.derive.outputs.tag }}
        run: |
          ./scripts/release/changelog-section.sh --release "$TAG" > notes.md
          cat notes.md

      # Releases build from master only. A v* tag pushed from another branch would
      # otherwise ship that branch as THE Mac release at releases/latest.
      - name: Require the tagged commit to be on master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD origin/master \
            || { echo "::error::$(git rev-parse --short HEAD) is not on master - tag releases from master only."; exit 1; }
          echo "$(git rev-parse --short HEAD) is on master"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  mac-test:
    name: macOS build and test
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same gate as mac-ci.yml and preview.yml (scripts/test-mac.sh): no test may skip or fail
      # before any signing or notarization minutes are spent.
      - name: Test
        run: ./scripts/test-mac.sh

  mac:
    name: macOS
    needs: [prepare, mac-test]
    # build, sign, notarize, DMG, Sparkle appcast -> artifact mac-dmg-appcast: the same file
    # preview.yml calls. Its one job names the "signing" environment, and its header lists the
    # Mac secrets and says why they arrive by inherit rather than by name.
    #
    # preview.yml passes appcast-tag too, so every preview run, dry or real, exercises the notes
    # download, the Sparkle appcast and the mac-dmg-appcast upload this release depends on.
    uses: ./.github/workflows/mac-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      appcast-tag: ${{ needs.prepare.outputs.tag }}
      artifact: mac-dmg-appcast
    secrets: inherit

  windows:
    name: Windows
    needs: prepare
    # test -> package (win-x64, win-arm64) -> smoke, the same file preview.yml and
    # windows-ci.yml call. require-signing is stated here rather than derived from a secret:
    # windows-build.yml's own gate job fails the run before the signed packaging jobs start
    # (the unsigned test job runs in parallel) if any of the six AZURE_* secrets is missing,
    # and the smoke job therefore installs with -ExpectSigned and checks the arm64 Setup.exe
    # signature.
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      require-signing: true
    # Only the six Windows signing secrets, by name. `secrets: inherit` would hand
    # the called workflow every repository secret, where these six are all it uses.
    # (The Apple ones are "signing" environment secrets, which no Windows job names;
    # mac-build.yml takes inherit because an environment's secrets reach a called
    # workflow no other way.)
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}

  publish:
    name: Publish release
    needs: [prepare, mac, windows]
    # Writes the release; preview-feed, after it, writes only the preview feed. A
    # workflow_dispatch rehearsal reaches neither.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-dmg-appcast
          path: mac

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velopack-win-x64
          path: artifacts/win-x64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velopack-win-arm64
          path: artifacts/win-arm64

      - name: Build release notes body
        run: |
          # The GitHub release body is the changelog section between a download paragraph and
          # the compare link. Only the body gets the paragraph: the appcast and the Windows
          # packages embedded notes.md as it was, and their update dialogs must not tell the
          # user which file to download. GitHub lists every asset, updater packages included,
          # so the body says which two files a person actually wants.
          {
            printf '**Download:** on a Mac, **ConnectorControl_%s.dmg**; on a Windows PC, **ConnectorControl-win-x64-Setup.exe** (Intel and AMD) or **ConnectorControl-win-arm64-Setup.exe** (Arm). Everything else listed below (appcast.xml, the .nupkg packages, releases.*.json) is read by the apps'\'' built-in updaters and never needs downloading.\n\n' "$VERSION"
            cat notes/notes.md
          } > body.md
          # Drafts and prereleases must not be the compare base. A transient API hiccup must not
          # silently drop the compare link (the old `|| true` did exactly that) - retry a few
          # times instead. LISTED tracks whether a call ever succeeded, distinct from PREV being
          # empty because there genuinely is no previous release, so 5 straight failures fail the
          # job instead of quietly publishing without a compare link.
          PREV=""
          LISTED=0
          for i in $(seq 1 5); do
            PREV=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName') && { LISTED=1; break; }
            echo "gh release list failed, retrying ($i/5)"
            sleep 5
          done
          [ "${LISTED:-0}" = 1 ] || { echo "::error::gh release list failed 5 times"; exit 1; }
          if [ -n "$PREV" ] && [ "$PREV" != "null" ] && [ "$PREV" != "$TAG" ]; then
            printf '\n**Full changelog**: %s/compare/%s...%s\n' "$REPO_URL" "$PREV" "$TAG" >> body.md
          fi

      # ensure-release.sh deletes any stale draft under $TAG first (it would otherwise make
      # GitHub refuse to publish anything else under it), then creates the release WITH the DMG
      # and appcast already attached - so it is never "latest" without its feed - or, on a
      # re-run, reuses it and uploads only whichever of the two Mac assets is not already there
      # (never replacing a published one; see the script for why).
      - name: Create the release, with the Mac assets already attached
        run: |
          ./scripts/release/ensure-release.sh "$TAG" --full \
            --title "Connector Control $VERSION" --notes body.md \
            "mac/ConnectorControl_$VERSION.dmg" mac/appcast.xml

      # gh, not vpk, uploads everything, a re-run skips a RID whose assets are all published
      # (and refuses to complete a half-published one) - all of it, with the reasons, in the
      # script preview.yml calls too.
      - name: Upload the Windows assets
        run: ./scripts/release/upload-release-assets.sh "$TAG" "$VERSION" artifacts

      - name: Verify the release
        run: |
          ./scripts/release/verify-release.sh "$TAG" --full --version "$VERSION"

          # This release must now be releases/latest: the Mac appcast URL
          # (releases/latest/download/appcast.xml) resolves through it. GitHub can take a few
          # seconds to move the pointer and the download redirect, hence the retry.
          # `|| true` on both probes: this loop exists to ride out a slow or flaky API, and
          # the step runs under `bash -e`, so an unguarded assignment would exit on the first
          # 5xx instead of retrying. The assertions after the loop still decide the outcome.
          for i in $(seq 1 12); do
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
            REDIRECT=$(curl -s -o /dev/null -w '%{redirect_url}' "$REPO_URL/releases/latest/download/appcast.xml" || true)
            [ "$LATEST" = "$TAG" ] && [ "$REDIRECT" = "$REPO_URL/releases/download/$TAG/appcast.xml" ] && break
            echo "waiting for releases/latest ($LATEST) and the appcast redirect ($REDIRECT) to reach $TAG ($i/12)"
            sleep 10
          done
          [ "$LATEST" = "$TAG" ] || { echo "::error::releases/latest is $LATEST, not $TAG"; exit 1; }
          [ "$REDIRECT" = "$REPO_URL/releases/download/$TAG/appcast.xml" ] || { echo "::error::appcast redirect is '$REDIRECT'"; exit 1; }
          # The served appcast must announce THIS version, point at this release's DMG and be
          # signed, by the rules update-preview-feed.sh applies to the preview feed. The build
          # number is read from it, not derived again: build-app.sh alone owns that formula.
          curl -sfL --retry 5 --retry-delay 5 --retry-all-errors "$REPO_URL/releases/latest/download/appcast.xml" > served-appcast.xml
          BUILD=$(./scripts/release/check-appcast.sh served-appcast.xml "$VERSION" "$REPO_URL/releases/download/$TAG/ConnectorControl_$VERSION.dmg")
          # A stable build has no preview component: digits only.
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::stable appcast build '$BUILD' is not a plain number"; exit 1; }
          {
            echo "## Sparkle appcast for $TAG"
            echo
            echo "- releases/latest: $LATEST; appcast redirect: $REDIRECT; build $BUILD"
          } >> "$GITHUB_STEP_SUMMARY"

  preview-feed:
    name: Update the Mac preview feed
    needs: [prepare, publish]
    # Mac preview installs read the preview feed, not releases/latest; this copies the release's
    # published appcast onto it so they are offered this release (scripts/release/
    # update-preview-feed.sh, the script preview.yml calls, which never moves the feed
    # backwards). A separate job rather than a step in publish, so the preview feed can never
    # fail, delay or interleave with the release: it starts only once publish has created and
    # verified the release, releases/latest and the stable appcast, and nothing runs after it.
    # continue-on-error keeps the run green when it fails - the release is out and correct -
    # while the job still shows red, with its error annotation, in the run's graph; Re-run this
    # job retries only the feed. Stable installs never read the feed, so a failure here only
    # leaves preview installs on their preview until the job is re-run or the next preview
    # publishes.
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Shared with preview.yml's job of the same name: the feed's compare-then-replace is not
    # atomic, and a preview and a release publishing at once must not interleave it.
    concurrency:
      group: preview-feed
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update and verify the preview feed
        run: |
          if ! ./scripts/release/update-preview-feed.sh "$TAG"; then
            echo "::error title=Preview feed not updated::$TAG is released and the stable feed is verified, but Mac preview installs were not pointed at it. Re-run this job; the release itself needs nothing."
            {
              echo "## Preview feed NOT updated"
              echo
              echo "$TAG is released and verified. Mac preview installs are not offered it until this job is re-run (or the next preview publishes)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

# Build, sign, and publish one Connector Control release — the Mac DMG with its
# Sparkle appcast AND the Windows installers — from a single version tag.
#
# Jobs:
#   prepare          (ubuntu)   version from the tag; CHANGELOG section -> notes.md (gate 1);
#                               the tagged commit is on master (gate 2); all six Windows
#                               signing secrets exist (gate 3) — a release is never unsigned
#   mac-test         (macos-15) swift test; a failed test, or a skipped one other than the
#                               deliberate goldens-regeneration skip, stops the run here
#   mac              (macos-15) build, sign, notarize, DMG, appcast   -> artifact "mac"
#   windows          (windows)  .github/workflows/windows-build.yml with require-signing: true —
#                               test, then matrix win-x64/win-arm64 publish + signed vpk pack
#                               -> "velopack-<rid>", then silent install + launch of the x64
#                               package with the signature required and the arm64 Setup.exe
#                               signature checked. windows-preview.yml calls the same file.
#   publish          (ubuntu)   the ONLY writer: creates the release WITH the DMG and appcast
#                               attached (so it is never "latest" without its feed), uploads the
#                               Windows assets (never overwriting a published one), verifies
#                               releases/latest and the served appcast (version, build,
#                               enclosure, EdDSA signature)
#
# Trigger: exact vX.Y.Z tags only (see below). workflow_dispatch runs everything EXCEPT
# publish — a rehearsal that cannot create a release (its version input names the
# CHANGELOG section and stamps the packages; the artifacts are the only output).
#
# Required secrets. The Mac set belongs in the "signing" GitHub Environment (Settings ▸
# Environments), which only the mac job names: with required reviewers and a deployment
# policy of the master branch plus v* tags on that environment, no job GitHub has not shown
# a human can read them. The Windows set stays a repository secret set: both prepare jobs
# check for it before any build minutes are spent, and a preview may be cut from any branch.
#   Mac (same names as the trailcache repo):
#   APPLE_CERTIFICATE          base64-encoded Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD password for the .p12
#   APPLE_SIGNING_IDENTITY     e.g. "Developer ID Application: David LaPorte (TEAMID)"
#   APPLE_ID                   Apple ID email used for notarization
#   APPLE_PASSWORD             app-specific password for that Apple ID
#   APPLE_TEAM_ID              10-character team identifier
#   KEYCHAIN_PASSWORD          any string; protects the throwaway CI keychain
#   SPARKLE_ED_PRIVATE_KEY     EdDSA private key that signs the appcast (backup: login Keychain)
#   Windows (Azure Artifact Signing, design spec §8.4) — ALL SIX are required:
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   service principal with the
#                                                          "Trusted Signing Certificate Profile Signer"
#                                                          role (DefaultAzureCredential, Azure.Identity)
#   AZURE_SIGNING_ENDPOINT                                 e.g. https://eus.codesigning.azure.net
#   AZURE_SIGNING_ACCOUNT                                  the signing account name
#   AZURE_SIGNING_PROFILE                                  the certificate profile name

name: Release

# A rehearsal dispatch and a tag push must never build side by side; runs queue instead.
concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    tags:
      # Exact stable versions only — no trailing wildcard. A suffixed tag
      # (v1.3.0-beta1) must never build here: the release would be created
      # without --prerelease, become "latest", and its appcast would be
      # served from SUFeedURL to every auto-updating install.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, X.Y.Z (needs a "## vX.Y.Z" section in CHANGELOG.md). Nothing is published.'
        required: true
        type: string

# Read-only by default; only the publish job raises this to contents: write.
permissions:
  contents: read

jobs:
  prepare:
    name: Version, notes, and gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive version
        id: derive
        run: |
          # A tag push is the real thing; a dispatch rehearses version X.Y.Z from the input.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::version input '$INPUT_VERSION' is not X.Y.Z"; exit 1; }
            TAG="v$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_EVENT_NAME -> $TAG (${TAG#v})"

      # First, before minutes of build/notarization: the changelog is the
      # single source for the GitHub release notes, the Sparkle update
      # dialog AND the Windows update dialog, and failing here enforces that
      # every release ships with one.
      - name: Extract changelog section
        env:
          TAG: ${{ steps.derive.outputs.tag }}
        run: |
          awk -v ver="## ${TAG}" '$0 == ver {found=1; next}
               /^## / && found {exit} found {print}' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## ${TAG}' section — write one before tagging."
            exit 1
          fi
          cat notes.md

      # Releases build from master only. A v* tag pushed from another branch would
      # otherwise ship that branch as THE Mac release at releases/latest.
      - name: Require the tagged commit to be on master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor HEAD origin/master \
            || { echo "::error::$(git rev-parse --short HEAD) is not on master — tag releases from master only."; exit 1; }
          echo "$(git rev-parse --short HEAD) is on master"

      # A release is never built unsigned, and neither is a preview: both workflows call
      # windows-build.yml with require-signing: true, and both prove the secrets are there
      # first, so their absence fails the run before any build starts.
      - name: Require the Windows signing secrets
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                      AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows signing secrets missing:$missing. A release is never built unsigned — add them under Settings ▸ Secrets and variables ▸ Actions, then re-run."
            exit 1
          fi
          echo "All six AZURE_* signing secrets are present."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  mac-test:
    name: macOS build and test
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same gate as mac-ci.yml (scripts/test-mac.sh): the suite must pass with exactly the
      # one deliberate skip before any signing or notarization minutes are spent.
      - name: Test
        run: ./scripts/test-mac.sh

  mac:
    name: macOS build, sign, notarize
    needs: [prepare, mac-test]
    runs-on: macos-15
    # The Apple certificate and the Sparkle key are read here and nowhere else.
    # Keep them as secrets of the "signing" GitHub Environment (with required
    # reviewers and a v* tag policy) rather than as repository secrets: a job
    # that does not name this environment then cannot read them at all, which
    # is what stops a workflow file edited on some other branch from ever
    # holding them. GitHub creates the environment unprotected on first use;
    # the protection rules live in repository settings.
    environment: signing
    # Longest job on the slowest runner: `notarytool submit --wait` blocks on Apple's
    # service twice (app, then DMG). 12-20 min is normal; 60 is a hang, not a queue.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Interpolated once here rather than inside run: blocks (injection hygiene).
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # notes.md lands in the working directory so the appcast step reads it
      # exactly as it always has.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: .

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # The decoded .p12 lives under RUNNER_TEMP, never in the checkout,
          # and is removed by a trap so an import failure cannot leave it on
          # disk; the throwaway keychain is deleted by the always() step below.
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          P12="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$P12"' EXIT
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build and sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          # BUILD_NUMBER deliberately not set: build-app.sh derives it from
          # the version (monotonic across releases — Sparkle's comparison
          # key), where the old run-number scheme let a re-tagged older
          # version outrank newer ones.
          VERSION="${TAG#v}" \
            UNIVERSAL=1 SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            ./scripts/build-app.sh

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "build/Connector Control.app" notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "build/Connector Control.app"
          spctl --assess --type execute --verbose=2 "build/Connector Control.app"

      - name: Package and notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          VERSION="${TAG#v}"
          ./scripts/make-dmg.sh "ConnectorControl_${VERSION}.dmg"
          # Sign and notarize the DMG too, so Gatekeeper trusts the download
          # end-to-end (hdiutil does not sign what it creates).
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" \
            "ConnectorControl_${VERSION}.dmg"
          xcrun notarytool submit "ConnectorControl_${VERSION}.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "ConnectorControl_${VERSION}.dmg"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          VERSION="${TAG#v}"
          # Must run AFTER stapling — the EdDSA signature covers the final
          # DMG bytes. Tools version pinned to match Package.resolved.
          # -f: an HTTP error page must fail here, not reach tar as a bogus
          # archive with a misleading "Unrecognized archive format" error.
          #
          # The private key is piped into a binary from this archive, so the
          # archive is pinned by content, not just by URL: a GitHub release
          # asset can be deleted and re-uploaded under the same name. The
          # digest below is Sparkle-2.9.6.tar.xz as published (it matches the
          # asset digest GitHub reports for that release); bumping the Sparkle
          # tools means bumping this literal in the same commit. It is
          # extracted under RUNNER_TEMP so a hostile archive could not plant
          # files in the checkout that later steps read.
          SPARKLE_SHA256=52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192
          SPARKLE_TOOLS="$RUNNER_TEMP/sparkle-tools"
          curl -sfL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/sparkle-tools.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle-tools.tar.xz" | shasum -a 256 -c - \
            || { echo "::error::Sparkle-2.9.6.tar.xz does not match the pinned SHA-256; refusing to sign with its tools."; exit 1; }
          mkdir "$SPARKLE_TOOLS" && tar -xf "$RUNNER_TEMP/sparkle-tools.tar.xz" -C "$SPARKLE_TOOLS"
          mkdir appcast-work
          cp "ConnectorControl_${VERSION}.dmg" appcast-work/
          # Render the changelog to HTML (GitHub's markdown renderer) and drop
          # it next to the DMG; --embed-release-notes inlines it into the
          # appcast item so the update dialog shows it.
          # Emit an HTML FRAGMENT (no DOCTYPE/body) — that's what
          # generate_appcast embeds into the item's description CDATA.
          gh api -X POST /markdown -f mode=markdown -f text="$(cat notes.md)" > notes-body.html
          {
            echo '<style>body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; margin: 12px; }</style>'
            cat notes-body.html
          } > "appcast-work/ConnectorControl_${VERSION}.html"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_TOOLS/bin/generate_appcast" \
            --ed-key-file - \
            --embed-release-notes \
            --download-url-prefix "https://github.com/dlaporte/connector-control/releases/download/${TAG}/" \
            --link "https://github.com/dlaporte/connector-control/releases" \
            -o appcast.xml appcast-work
          cat appcast.xml

      # The publish job posts these; nothing is uploaded to GitHub from here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          path: |
            ConnectorControl_*.dmg
            appcast.xml
          if-no-files-found: error
          retention-days: 14

      # The signing identity must not outlive the job, whether it passed or failed.
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

  windows:
    name: Windows
    needs: prepare
    # test -> package (win-x64, win-arm64) -> smoke, the same file windows-preview.yml and
    # windows-ci.yml call. require-signing is stated here rather than derived from a secret:
    # prepare has already failed the run if any of the six AZURE_* secrets is missing, and the
    # smoke job therefore installs with -ExpectSigned and checks the arm64 Setup.exe signature.
    # prerelease: false — "previous", for the delta package, is the newest full v* release
    # carrying releases.<rid>.json (none before v1.3.0, so the first release shipped without a
    # delta package and v1.3.1 gets one against v1.3.0).
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: false
      require-signing: true
    # Only the six Windows signing secrets, by name. `secrets: inherit` would
    # also hand the called workflow the Apple certificate and the Sparkle key,
    # which no Windows job has any use for.
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}

  publish:
    name: Publish release
    needs: [prepare, mac, windows]
    # The only job that writes anything. A workflow_dispatch rehearsal never reaches it.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      REPO_URL: https://github.com/dlaporte/connector-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mac
          path: mac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velopack-win-x64
          path: artifacts/win-x64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velopack-win-arm64
          path: artifacts/win-arm64

      - name: Create the release, with the Mac assets already attached
        run: |
          set -o pipefail
          # The GitHub release body is the changelog section between a download paragraph and
          # the compare link. Only the body gets the paragraph: the appcast and the Windows
          # packages embedded notes.md as it was, and their update dialogs must not tell the
          # user which file to download. GitHub lists every asset, updater packages included,
          # so the body says which two files a person actually wants.
          {
            printf '**Download:** on a Mac, **ConnectorControl_%s.dmg**; on a Windows PC, **ConnectorControl-win-x64-Setup.exe** (Intel and AMD) or **ConnectorControl-win-arm64-Setup.exe** (Arm). Everything else listed below (appcast.xml, the .nupkg packages, releases.*.json) is read by the apps'\'' built-in updaters and never needs downloading.\n\n' "$VERSION"
            cat notes/notes.md
          } > body.md
          # Drafts and prereleases must not be the compare base.
          PREV=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[0].tagName' || true)
          if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
            printf '\n**Full changelog**: %s/compare/%s...%s\n' "$REPO_URL" "$PREV" "$TAG" >> body.md
          fi
          # Stale drafts under this tag would make GitHub refuse to publish anything else under
          # it; the script explains why they can go.
          ./windows/scripts/delete-stale-drafts.sh "$TAG"
          if EXISTING=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            if [ "$EXISTING" != "false" ]; then
              echo "::error::Release $TAG exists and IS a prerelease; a v* tag must be a full release. Delete it and re-run."
              exit 1
            fi
            # Re-run path: the release is already published and already "latest". A published
            # binary is never overwritten — a re-run has rebuilt the DMG, and a different DMG
            # under the same version and build number with a fresh valid signature is exactly
            # what an update system must never see. Both Mac assets are uploaded only when
            # neither is there yet. Half a pair is an error, not something to complete: the
            # appcast's EdDSA signature covers the DMG bytes, and this run's DMG is not the one
            # already published. The body is not refreshed on a re-run: notes.md came from the
            # same CHANGELOG section.
            echo "Release $TAG already exists (re-run); reusing it."
            gh release view "$TAG" --json assets --jq '.assets[].name' > existing-assets.txt
            HAVE_DMG=false; HAVE_APPCAST=false
            grep -qx "ConnectorControl_$VERSION.dmg" existing-assets.txt && HAVE_DMG=true
            grep -qx "appcast.xml" existing-assets.txt && HAVE_APPCAST=true
            if [ "$HAVE_DMG" = true ] && [ "$HAVE_APPCAST" = true ]; then
              echo "Both Mac assets are already published; leaving them untouched."
            elif [ "$HAVE_DMG" = false ] && [ "$HAVE_APPCAST" = false ]; then
              gh release upload "$TAG" "mac/ConnectorControl_$VERSION.dmg" mac/appcast.xml
            else
              echo "::error::$TAG carries one Mac asset but not the other (dmg=$HAVE_DMG appcast=$HAVE_APPCAST). Published assets are never replaced: remove the stray one with 'gh release delete-asset $TAG <name> --yes' and re-run, or delete the release and re-tag."
              exit 1
            fi
          else
            # The DMG and the appcast are positional arguments to `gh release create`, NOT a
            # follow-up upload: with assets to attach, gh creates the release as a draft, uploads
            # them, and only then publishes it. That matters because SUFeedURL is
            # releases/latest/download/appcast.xml, GitHub moves releases/latest the instant a
            # full release is published, and a missing asset under that path is a hard 404 — not
            # a fall-back to the previous release. Creating the release first and uploading after
            # would leave every polling Mac with a broken feed for the length of the upload, and
            # forever if the job died in between.
            # No --prerelease and no --latest: GitHub marks the newest full release
            # "latest" on its own, which is exactly what SUFeedURL relies on.
            gh release create "$TAG" --title "Connector Control $VERSION" --notes-file body.md \
              "mac/ConnectorControl_$VERSION.dmg" mac/appcast.xml
          fi

      # gh, not vpk, uploads everything, a re-run skips a RID whose assets are all published
      # (and refuses to complete a half-published one), and the pack-time releases.<rid>.json
      # is filtered to this build's own packages first — all of it, with the reasons, in the
      # script windows-preview.yml calls too.
      - name: Upload the Windows assets
        run: ./windows/scripts/upload-release-assets.sh "$TAG" "$VERSION" artifacts

      - name: Verify the release
        run: |
          set -o pipefail
          gh release view "$TAG" --json isPrerelease,isDraft,assets --jq '{prerelease: .isPrerelease, draft: .isDraft, assets: [.assets[].name]}' | tee release.json
          [ "$(jq -r .prerelease release.json)" = "false" ] || { echo "::error::$TAG is a prerelease"; exit 1; }
          [ "$(jq -r .draft release.json)" = "false" ] || { echo "::error::$TAG is a draft"; exit 1; }
          for a in "ConnectorControl_$VERSION.dmg" appcast.xml \
                   ConnectorControl-win-x64-Setup.exe ConnectorControl-win-arm64-Setup.exe \
                   "ConnectorControl-$VERSION-win-x64-full.nupkg" "ConnectorControl-$VERSION-win-arm64-full.nupkg" \
                   releases.win-x64.json releases.win-arm64.json; do
            jq -e --arg a "$a" '.assets | index($a) != null' release.json >/dev/null || { echo "::error::asset $a missing from $TAG"; exit 1; }
          done
          # This release must now be releases/latest: the Mac appcast URL
          # (releases/latest/download/appcast.xml) resolves through it. GitHub can take a few
          # seconds to move the pointer and the download redirect, hence the retry.
          # `|| true` on both probes: this loop exists to ride out a slow or flaky API, and
          # the step runs under `bash -e`, so an unguarded assignment would exit on the first
          # 5xx instead of retrying. The assertions after the loop still decide the outcome.
          for i in $(seq 1 12); do
            LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
            REDIRECT=$(curl -s -o /dev/null -w '%{redirect_url}' "$REPO_URL/releases/latest/download/appcast.xml" || true)
            [ "$LATEST" = "$TAG" ] && [ "$REDIRECT" = "$REPO_URL/releases/download/$TAG/appcast.xml" ] && break
            echo "waiting for releases/latest ($LATEST) and the appcast redirect ($REDIRECT) to reach $TAG ($i/12)"
            sleep 10
          done
          [ "$LATEST" = "$TAG" ] || { echo "::error::releases/latest is $LATEST, not $TAG"; exit 1; }
          [ "$REDIRECT" = "$REPO_URL/releases/download/$TAG/appcast.xml" ] || { echo "::error::appcast redirect is '$REDIRECT'"; exit 1; }
          # The served appcast must announce THIS version, carry the monotonic build number
          # build-app.sh derives (major*10000 + minor*100 + patch), and point at this
          # release's DMG.
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          BUILD=$(( MAJ * 10000 + MIN * 100 + PAT ))
          curl -sfL --retry 5 --retry-delay 5 --retry-all-errors "$REPO_URL/releases/latest/download/appcast.xml" > served-appcast.xml
          grep -q "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" served-appcast.xml || { echo "::error::served appcast does not announce $VERSION"; exit 1; }
          grep -q "<sparkle:version>$BUILD</sparkle:version>" served-appcast.xml || { echo "::error::served appcast build number is not $BUILD"; exit 1; }
          grep -q "url=\"$REPO_URL/releases/download/$TAG/ConnectorControl_$VERSION.dmg\"" served-appcast.xml || { echo "::error::served appcast enclosure is not this release's DMG"; exit 1; }
          # An unsigned item is refused by Sparkle at update time and looks perfectly fine on
          # the release page — the failure mode is "1.3.0 is live, nobody's Mac updates".
          grep -q 'sparkle:edSignature="[^"][^"]*"' served-appcast.xml || { echo "::error::served appcast item carries no EdDSA signature"; exit 1; }
          {
            echo "## Release $TAG ($VERSION)"
            echo
            echo "- Release: $REPO_URL/releases/tag/$TAG"
            echo "- releases/latest: $LATEST; appcast redirect: $REDIRECT; build $BUILD"
            echo "- Assets:"
            jq -r '.assets[] | "  - " + .' release.json
          } >> "$GITHUB_STEP_SUMMARY"

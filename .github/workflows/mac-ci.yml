# Runs the Swift suite and an ad-hoc build on every push; release.yml re-runs the suite
# before signing.
#
# No pull_request trigger: every push in this repository is to a branch of the same repo (no
# forks), so the push trigger below already runs on every branch, including PR branches.
name: Mac CI

on:
  push:
    branches: ['**']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/**'
      - '.github/workflows/mac-ci.yml'

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: macOS build and test
    # macos-15 is pinned deliberately (as are the ubuntu-24.04 and windows-2025 images used
    # elsewhere in this repo's workflows): a runner-image rollover is a deliberate version bump
    # here, not something that happens under a floating "-latest" label. Dependabot does not
    # manage these.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # test-mac.sh fails if any test skips or fails.
      - name: Test
        run: ./scripts/test-mac.sh

      # The MCP Inspector (Node 22.19 or later) drives connector-control mcp against the headless
      # test host: the MCP subset this repo writes for itself, checked by the reference client.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Build the command-line tool and the test host
        run: |
          swift build --product connector-control
          swift build --product connector-control-test-host

      - name: MCP Inspector check
        run: ./scripts/mac/inspector-check.sh .build/debug/connector-control .build/debug/connector-control-test-host

      # The same assembly the release performs, ad-hoc signed: a broken build-app.sh,
      # generate-icon.swift or Sparkle embedding fails here instead of on a tag.
      - name: Build the app bundle
        run: ./scripts/build-app.sh

      # The tool inside the bundle: signed on its own, before the app, with its own identifier, and
      # runnable from there without an app.
      - name: The nested tool's signature
        run: |
          TOOL="build/Connector Control.app/Contents/MacOS/connector-control"
          codesign --verify --strict --verbose=2 "$TOOL"
          codesign --verify --strict --deep --verbose=2 "build/Connector Control.app"
          # Captured first: grep -q leaving a pipe early would end codesign with SIGPIPE, which pipefail
          # reports as a failure.
          details=$(codesign -d --verbose=2 "$TOOL" 2>&1)
          grep -qx 'Identifier=com.dlaporte.connector-control.cli' <<< "$details" \
            || { echo "::error::$TOOL is not signed as com.dlaporte.connector-control.cli"; exit 1; }
          "$TOOL" --version
          usage=$("$TOOL" help)
          [ "$(head -1 <<< "$usage")" = 'Usage: connector-control <command> [options]' ] \
            || { echo "::error::help printed something else"; exit 1; }

      # A Sparkle update replaces the bundle and ends only the app; the relay Claude runs from the old
      # bundle must carry on. CI cannot run a signed update, so the replacement is done by hand here.
      - name: A running relay survives the app being replaced
        run: ./scripts/mac/relay-check.sh "build/Connector Control.app" .build/debug/connector-control-test-host

      # Proves make-dmg.sh too, the same way, before a tag ever reaches it.
      - name: Build the DMG
        run: ./scripts/make-dmg.sh build/ConnectorControl-ci.dmg

# Runs the Swift suite and an ad-hoc build on every push; release.yml re-runs the suite
# before signing.
#
# No pull_request trigger: every push in this repository is to a branch of the same repo (no
# forks), so the push trigger below already runs on every branch, including PR branches.
name: Mac CI

on:
  push:
    branches: ['**']
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'scripts/**'
      - '.github/workflows/mac-ci.yml'

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: macOS build and test
    # macos-15 is pinned deliberately (as are the ubuntu-24.04 and windows-2025 images used
    # elsewhere in this repo's workflows): a runner-image rollover is a deliberate version bump
    # here, not something that happens under a floating "-latest" label. Dependabot does not
    # manage these.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # test-mac.sh fails on any failure and on any skip other than the deliberate one.
      - name: Test
        run: ./scripts/test-mac.sh

      # The same assembly the release performs, ad-hoc signed: a broken build-app.sh,
      # generate-icon.swift or Sparkle embedding fails here instead of on a tag.
      - name: Build the app bundle
        run: ./scripts/build-app.sh

      # Proves make-dmg.sh too, the same way, before a tag ever reaches it.
      - name: Build the DMG
        run: ./scripts/make-dmg.sh build/ConnectorControl-ci.dmg

# Windows preview builds (design spec §3, §8.3): a GitHub PRERELEASE carrying Velopack
# packages for win-x64 and win-arm64, versioned <next>-preview.<n>, where <next> is the top
# "## vX.Y.Z" heading of CHANGELOG.md and <n> names the preview.
#
# TRIGGERS — two tag shapes and a manual dispatch:
#
#   windows-preview-<n>       tag push:  real preview:  prepare -> build -> publish
#   windows-preview-dry-<n>   tag push:  dry run:       the same, with publish skipped
#   workflow_dispatch         number=<n>, dry_run (default true): the same two, from the Actions
#                             tab, with no tag to push or clean up
#
# A tag push runs the workflow file AS IT EXISTS AT THE TAGGED COMMIT, so a preview can be cut
# from any branch and a change to this workflow can be proved from a branch with a
# windows-preview-dry-<n> tag before it reaches master. A dispatch runs the file from the ref
# you choose, but the dispatch menu only lists workflow files that exist on the default branch —
# which is why both shapes are kept.
#
# Both build version <next>-preview.<n>; pick <n> with `git tag -l 'windows-preview-*'`.
# Neither tag shape matches release.yml's 'v[0-9]+.[0-9]+.[0-9]+' trigger, so no tag here can
# ever start a Mac release build; and windows-ci.yml triggers on branch pushes only, so one
# preview tag starts exactly one workflow run.
#
# A prerelease is never releases/latest, so the Mac app's Sparkle appcast at
# releases/latest/download/appcast.xml is untouched, and a preview install
# (prerelease version) only follows prereleases (VelopackUpdater).
#
# The build itself — test, package (win-x64, win-arm64), smoke — is
# .github/workflows/windows-build.yml, the same file release.yml calls. A preview is signed
# exactly like a release: prepare proves all six Azure Artifact Signing secrets (spec §8.4) are
# there, and the build is called with require-signing: true, so nothing here is ever unsigned.
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   service principal with the
#                                                          "Trusted Signing Certificate Profile Signer"
#                                                          role (DefaultAzureCredential, Azure.Identity)
#   AZURE_SIGNING_ENDPOINT                                 e.g. https://eus.codesigning.azure.net
#   AZURE_SIGNING_ACCOUNT                                  the signing account name
#   AZURE_SIGNING_PROFILE                                  the certificate profile name
name: Windows Preview

on:
  push:
    tags:
      - 'windows-preview-*'
  workflow_dispatch:
    inputs:
      number:
        description: 'Preview number <n>: builds <next>-preview.<n> and, unless this is a dry run, publishes it as windows-preview-<n>.'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build and smoke-test everything, publish nothing.'
        required: false
        default: true
        type: boolean

# Read-only by default; only the publish job raises this to contents: write.
permissions:
  contents: read

concurrency:
  group: windows-preview
  cancel-in-progress: false

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      next: ${{ steps.derive.outputs.next }}
      number: ${{ steps.derive.outputs.number }}
      dry: ${{ steps.derive.outputs.dry }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # origin/master is the fallback compare base for the release notes. Create the
      # remote-tracking ref explicitly rather than relying on what a tag checkout fetched.
      - name: Fetch master
        run: git fetch --no-tags origin master:refs/remotes/origin/master

      - name: Derive version
        id: derive
        env:
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Three sources, one result: a dispatch takes <n> and dry_run from its inputs;
          # windows-preview-dry-<n> is a dry run (publish skipped); windows-preview-<n> is a real
          # preview. All three build <next>-preview.<n> under the tag windows-preview-<n>.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            N="$INPUT_NUMBER"; DRY="$INPUT_DRY_RUN"; TAG="windows-preview-$N"
            # GitHub ignores `gh release create --target` when the tag already exists, so a
            # reused number would publish THIS run's installers under an OLD tag's commit.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::tag $TAG already exists; pick an unused preview number (git tag -l 'windows-preview-*')."
              exit 1
            fi
          else
            case "$GITHUB_REF_NAME" in
              windows-preview-dry-*) N="${GITHUB_REF_NAME#windows-preview-dry-}"; DRY=true ;;
              windows-preview-*)     N="${GITHUB_REF_NAME#windows-preview-}";     DRY=false ;;
              *) echo "::error::Tag '$GITHUB_REF_NAME' is neither windows-preview-<n> nor windows-preview-dry-<n>."; exit 1 ;;
            esac
            TAG="$GITHUB_REF_NAME"
          fi
          case "$N" in ''|*[!0-9]*) echo "::error::preview number must be digits; got '$N'"; exit 1;; esac
          # The next Mac+Windows version is the top "## vX.Y.Z" heading of CHANGELOG.md (spec §8.3).
          NEXT=$(sed -n 's/^## v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' CHANGELOG.md | head -1)
          if [ -z "$NEXT" ]; then
            echo "::error::CHANGELOG.md has no '## vX.Y.Z' heading."
            exit 1
          fi
          if gh release view "v$NEXT" >/dev/null 2>&1; then
            echo "::error::CHANGELOG.md's top heading v$NEXT is already released; add the next version's section at the top first."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=$NEXT-preview.$N"
            echo "next=$NEXT"
            echo "number=$N"
            echo "dry=$DRY"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_EVENT_NAME -> $TAG: $NEXT-preview.$N (dry_run=$DRY)"

      # A preview is never built unsigned either: the same gate as release.yml's prepare, run
      # here before any build minutes are spent, because windows-build.yml is called with
      # require-signing: true and would fail in the package job without these.
      - name: Require the Windows signing secrets
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          missing=""
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                      AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows signing secrets missing:$missing. A preview is never built unsigned — add them under Settings ▸ Secrets and variables ▸ Actions, then re-run."
            exit 1
          fi
          echo "All six AZURE_* signing secrets are present."

      - name: Write release notes
        env:
          TAG: ${{ steps.derive.outputs.tag }}
          VERSION: ${{ steps.derive.outputs.version }}
          NEXT: ${{ steps.derive.outputs.next }}
          NUMBER: ${{ steps.derive.outputs.number }}
        run: |
          # Commits since the more recent of two points: the highest REAL preview below this
          # one (a windows-preview-dry-<n> tag is never a comparison point) and the newest v*
          # release reachable from here — previews are cut from master after a release, so
          # "since the last preview" alone would re-list a whole release. With neither (a
          # first preview on a fresh branch), since the branch left master.
          PREV=$(git tag -l 'windows-preview-[0-9]*' \
            | sed -n 's/^windows-preview-\([0-9][0-9]*\)$/\1/p' \
            | sort -n | awk -v n="$NUMBER" '$1 + 0 < n + 0' | tail -1)
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          BASE=""
          for candidate in ${PREV:+windows-preview-$PREV} $LAST; do
            if [ -z "$BASE" ] || git merge-base --is-ancestor "$BASE" "$candidate"; then
              BASE="$candidate"
            fi
          done
          if [ -n "$BASE" ]; then
            BASE_LABEL="$BASE"
          else
            BASE=$(git merge-base origin/master HEAD); BASE_LABEL="master (${BASE:0:7})"
          fi
          {
            echo "Windows **preview** build \`$VERSION\` of Connector Control, from commit ${GITHUB_SHA:0:7} (tag \`$TAG\`)."
            echo
            echo "> Preview builds are GitHub prereleases for Windows testers. They never touch the Mac app's update feed, and a preview install only updates to later previews (and to the final release). This build is code-signed (Azure Artifact Signing)."
            echo
            echo "### Install"
            echo
            echo "1. Download \`ConnectorControl-win-x64-Setup.exe\` (Intel/AMD PCs) or \`ConnectorControl-win-arm64-Setup.exe\` (ARM PCs) from the assets below."
            echo "2. Run it. It installs for the current user under \`%LOCALAPPDATA%\\ConnectorControl\`, adds a Start menu entry, and launches the app: look for the plug icon in the system tray (open the \`^\` overflow if it is hidden)."
            echo "3. On first run the app imports the connectors from Claude Desktop's \`claude_desktop_config.json\` into its master list. The first change you make snapshots the original file under \`%LOCALAPPDATA%\\Connector Control\\backups\`."
            echo "4. Uninstall from Settings ▸ Apps ▸ Installed apps; app data in \`%LOCALAPPDATA%\\Connector Control\` is left in place."
            echo
            echo "### Changes planned for v$NEXT (CHANGELOG.md)"
            echo
            awk -v ver="## v$NEXT" '$0 == ver {found=1; next} /^## / && found {exit} found {print}' CHANGELOG.md
            echo
            echo "### Commits since $BASE_LABEL"
            echo
            git log --format='- %s (%h)' "$BASE..HEAD"
          } > notes.md
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  windows:
    name: Windows
    needs: prepare
    # test -> package (win-x64, win-arm64) -> smoke, the same file release.yml calls.
    # prerelease: true — the previous release the delta package is built against is the newest
    # PRERELEASE of the channel, i.e. the preview before this one.
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: true
      require-signing: true
    secrets: inherit

  publish:
    name: Publish prerelease
    needs: [prepare, windows]
    # The only job that writes anything. A dry run — a windows-preview-dry-<n> tag or a dispatch
    # with dry_run — skips it entirely, so it creates no release and uploads no assets.
    if: needs.prepare.outputs.dry != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      REPO_URL: https://github.com/dlaporte/connector-control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes

      - uses: actions/download-artifact@v4
        with:
          name: velopack-win-x64
          path: artifacts/win-x64

      - uses: actions/download-artifact@v4
        with:
          name: velopack-win-arm64
          path: artifacts/win-arm64

      - name: Create the prerelease
        run: |
          set -o pipefail
          # --prerelease is the whole point: a prerelease is never releases/latest, so the Mac
          # appcast at releases/latest/download/appcast.xml keeps resolving to the last Mac
          # release. --latest is NEVER passed here, in any form. --target pins the tag to the
          # commit that is being built: on a tag push the tag already exists and GitHub ignores
          # it, and on a dispatch it is what stops gh from creating the tag on the default
          # branch instead of on the ref that was dispatched.
          #
          # Stale drafts under this tag would make GitHub refuse to publish anything else under
          # it; the script explains why they can go.
          ./windows/scripts/delete-stale-drafts.sh "$TAG"
          if EXISTING=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease 2>/dev/null); then
            if [ "$EXISTING" != "true" ]; then
              echo "::error::Release $TAG exists and is NOT a prerelease; refusing to touch it."
              exit 1
            fi
            echo "Release $TAG already exists (re-run); reusing it."
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Connector Control $VERSION (Windows preview)" --notes-file notes/notes.md
          fi

      # gh, not vpk, uploads everything, --clobber makes a re-run idempotent, and the pack-time
      # releases.<rid>.json is filtered to this build's own packages first — all of it, with the
      # reasons, in the script release.yml calls too.
      - name: Upload Velopack assets
        run: ./windows/scripts/upload-release-assets.sh "$TAG" "$VERSION" artifacts

      - name: Verify the release
        run: |
          set -o pipefail
          gh release view "$TAG" --json isPrerelease,isDraft,assets --jq '{prerelease: .isPrerelease, draft: .isDraft, assets: [.assets[].name]}' | tee release.json
          [ "$(jq -r .prerelease release.json)" = "true" ] || { echo "::error::$TAG is not a prerelease"; exit 1; }
          [ "$(jq -r .draft release.json)" = "false" ] || { echo "::error::$TAG is a draft; gh release create must publish it"; exit 1; }
          for a in ConnectorControl-win-x64-Setup.exe ConnectorControl-win-arm64-Setup.exe \
                   "ConnectorControl-$VERSION-win-x64-full.nupkg" "ConnectorControl-$VERSION-win-arm64-full.nupkg" \
                   releases.win-x64.json releases.win-arm64.json; do
            jq -e --arg a "$a" '.assets | index($a) != null' release.json >/dev/null || { echo "::error::asset $a missing from $TAG"; exit 1; }
          done
          # `gh release view --json isLatest` does not exist (gh 2.99.0: "Unknown JSON field"),
          # and "Latest" is a repository-level pointer anyway. This endpoint IS what the Mac
          # appcast URL resolves through, so asking it is the real check.
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [ "$LATEST" != "$TAG" ] || { echo "::error::$TAG became releases/latest — the Mac appcast would break"; exit 1; }
          case "$LATEST" in
            v[0-9]*) echo "releases/latest is still $LATEST (a Mac release)" ;;
            *) echo "::error::releases/latest is '$LATEST', which is not a Mac v* release"; exit 1 ;;
          esac
          {
            echo "## Windows preview $TAG ($VERSION)"
            echo
            echo "- Release: $REPO_URL/releases/tag/$TAG"
            echo "- releases/latest unchanged: $LATEST"
            echo "- Assets:"
            jq -r '.assets[] | "  - " + .' release.json
          } >> "$GITHUB_STEP_SUMMARY"

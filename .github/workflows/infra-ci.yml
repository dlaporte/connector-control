# Lint the CI plumbing itself: the workflow YAML and every shell/PowerShell script the
# workflows call. A broken script here fails in under a minute instead of partway through a
# 30-minute Windows build or a signed release.
name: Infra CI

on:
  push:
    branches: ['**']
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'Package.resolved'
      - 'CHANGELOG.md'
      - 'windows/scripts/**'
      - 'windows/tools/**'

permissions:
  contents: read

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows and scripts
    # ubuntu-24.04 is pinned deliberately, as elsewhere in this repo's workflows: a
    # runner-image rollover is a deliberate version bump, not something that happens under a
    # floating "-latest" label. Dependabot does not manage this pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        shell: bash
        run: |
          # Downloaded to a file, not piped into bash: `bash <(curl ...)` swallows a curl
          # failure since the process substitution itself still succeeds, so a broken download
          # would silently run nothing instead of failing the job. The version argument is
          # explicit because the SHA-pinned script installs the latest release when given none -
          # without it, the "v1.7.12" comment would just be a wish, not a pin.
          curl -sfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash # v1.7.12
          bash download-actionlint.bash 1.7.12
          ./actionlint -color

      - name: shellcheck
        shell: bash
        run: |
          shopt -s globstar nullglob
          mapfile -t files < <(printf '%s\n' scripts/*.sh scripts/**/*.sh | sort -u)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no .sh files found under scripts/"; exit 1; }
          # warning and above: info/style notes differ between shellcheck versions, and the runner image
          # ships a different one than a developer machine.
          shellcheck --severity=warning "${files[@]}"

      # The preview feed moves only forward, judged against the published releases, and a feed newer
      # than all of them fails the job: proved with a fake gh and curl, on the image the feed jobs use.
      - name: update-preview-feed.sh orders builds against the published releases
        run: ./scripts/tests/update-preview-feed-order.sh

      # The release gate: a changelog section of only empty sub-headings, or no section, fails;
      # empty sub-headings are dropped from what ships.
      - name: changelog-section.sh gates a release's notes
        run: ./scripts/tests/changelog-section.sh

      # Sparkle's tools pin (scripts/mac/sparkle-tools.env) must equal the Sparkle in
      # Package.resolved, so a Dependabot Sparkle bump fails on its pull request, not 20 minutes
      # into the next signed build. The runner image ships jq.
      - name: Sparkle tools pin matches Package.resolved
        run: |
          ./scripts/mac/check-sparkle-pin.sh
          ./scripts/tests/sparkle-pin.sh

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # -Path takes one string, and -EnableExit sets the host's exit code per call, so a clean
          # second folder would mask a finding in the first: collect both folders, then fail once.
          # -Severity Error leaves out the analyzer's separate ParseError severity, so the parser also
          # runs over every file itself: a script that does not parse fails here, not on a Windows runner.
          $parseErrors = @(foreach ($file in Get-ChildItem -Path 'windows/scripts', 'windows/tools' -Recurse -Filter '*.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { "$($file.FullName):$($e.Extent.StartLineNumber): $($e.Message)" }
          })
          $findings = @(foreach ($folder in 'windows/scripts', 'windows/tools') {
            Invoke-ScriptAnalyzer -Path $folder -Recurse -Severity Error, ParseError
          })
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Write-Host
          }
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
          }
          if ($parseErrors.Count -gt 0 -or $findings.Count -gt 0) { exit 1 }

# The Windows half of every build in this repo, in one place: restore/build/test, and — for a
# release or a preview — the Velopack packaging and the install smoke test. release.yml,
# windows-preview.yml and windows-ci.yml all call this, so the three cannot drift apart again
# (they had: one verify step without `set -o pipefail`, one smoke job without the arm64
# signature check, two spellings of the same signing decision).
#
# Inputs
#   version          the version stamped into the assemblies and the Velopack package
#                    (X.Y.Z for a release, X.Y.Z-preview.N for a preview). Unused when
#                    package is false; defaults to 0.0.0 for that case.
#   require-signing  signing is mandatory: the package job writes the Azure Artifact Signing
#                    metadata and passes -AzureTrustedSignFile, and the smoke job demands a
#                    valid Authenticode signature on both RIDs. This is an explicit decision by
#                    the caller — never inferred from whether a secret happens to be set. The
#                    gate job below is what proves the six AZURE_* secrets exist, and it fails
#                    the run before the signed packaging jobs start; the unsigned test job runs
#                    in parallel.
#   package          false runs the test job alone (windows-ci.yml's per-push build).
#
# A caller that packages passes the six AZURE_* secrets by name (declared under `secrets:`
# below; never `secrets: inherit`, which would also hand over the Mac signing secrets).
# GITHUB_TOKEN reaches a called workflow on its own, so windows-ci.yml passes nothing.
# Every job carries its own timeout-minutes: a `uses:` job in the caller cannot set one.
#
# The `notes` artifact is an INPUT to the package job: the caller's prepare job uploads it, and
# its text is embedded in the package and shown by the in-app update dialog.
# Artifacts produced: test-results, velopack-win-x64, velopack-win-arm64, smoke-logs.
name: Windows Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to stamp into the packages (X.Y.Z or X.Y.Z-preview.N). Unused, and optional, when package is false.'
        required: false
        default: '0.0.0'
        type: string
      require-signing:
        description: 'Signing is mandatory: sign the packages and require a valid signature in the smoke test.'
        required: true
        type: boolean
      package:
        description: 'Run the package and smoke jobs. false = test only.'
        required: false
        default: true
        type: boolean
    # The Azure Artifact Signing secrets, read only by the gate and package jobs. Optional at the
    # declaration so windows-ci.yml (package: false) can keep passing none; a caller that
    # packages with require-signing: true is proven by the gate job below to hold all six — the
    # gate runs before the signed packaging jobs; the unsigned test job runs in parallel.
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_SIGNING_PROFILE:
        required: false

# No permissions block: a called workflow never holds more than its caller, and nothing here
# writes to the repository. The callers stay read-only; only their publish jobs raise that.

jobs:
  # The one copy of this gate: release.yml and windows-preview.yml each used to carry their own,
  # identical, before their own build minutes were spent. Here it also gates package directly, so
  # a caller can never reach a signed package step with a secret missing.
  gate:
    name: Require Windows signing secrets
    if: inputs.require-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the Windows signing secrets
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          missing=0
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                      AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. A signed build never runs without all six AZURE_* secrets — add it under Settings ▸ Secrets and variables ▸ Actions, then re-run."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All six AZURE_* signing secrets are present."

  test:
    name: Build and test
    # windows-2025 is pinned deliberately (as is ubuntu-24.04 and macos-15 elsewhere in this
    # repo's workflows): a runner-image rollover is a deliberate version bump here, not
    # something that happens under a floating "-latest" label. Dependabot does not manage these.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore windows/ConnectorControl.slnx

      - name: Build
        shell: pwsh
        run: dotnet build windows/ConnectorControl.slnx --no-restore -c Release

      # ci.runsettings sets xUnit FailSkips, so a test that silently skips on the
      # runner (a Windows-only test that did not run) fails the build.
      - name: Test
        shell: pwsh
        run: dotnet test windows/ConnectorControl.slnx --no-build -c Release --settings windows/ci.runsettings --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  package:
    name: Package ${{ matrix.rid }}
    needs: [gate, test]
    # A skipped gate (require-signing: false) must not skip package for the unsigned case; a
    # failed gate (require-signing: true, a secret missing) must. needs.test.result is checked
    # explicitly (with !cancelled(), not the bare success() GitHub implies over needs) because a
    # skipped gate would otherwise make the implicit success() over needs true even when test
    # failed or was cancelled.
    if: ${{ !cancelled() && needs.test.result == 'success' && inputs.package && (inputs.require-signing == false || needs.gate.result == 'success') }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: windows/global.json

      # vpk 1.2.0 is a LOCAL tool (windows/.config/dotnet-tools.json), restored from the
      # manifest rather than installed globally: a version bump is then a one-line diff reviewed
      # like any other dependency change, instead of a number buried in a workflow run step.
      - name: Restore local tools
        shell: pwsh
        working-directory: windows
        run: dotnet tool restore

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: notes

      - name: Write Azure Artifact Signing metadata
        if: inputs.require-signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          foreach ($name in 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "require-signing is set but the $name secret is missing" }
          }
          $file = Join-Path $env:RUNNER_TEMP 'azure-signing.json'
          @{ Endpoint = $env:AZURE_SIGNING_ENDPOINT; CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT; CertificateProfileName = $env:AZURE_SIGNING_PROFILE } |
            ConvertTo-Json | Set-Content -Path $file -Encoding utf8NoBOM
          "SIGN_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # publish + pack only now (no delta download to stall on): ~4 min on a green run.
      - name: Publish and pack
        timeout-minutes: 6
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          VERSION: ${{ inputs.version }}
          RID: ${{ matrix.rid }}
          REQUIRE_SIGNING: ${{ inputs.require-signing }}
        run: |
          # A hashtable, not an array: PowerShell splats an array positionally, which would hand
          # the literal string "-Version" to the Version parameter.
          $packArgs = @{ Version = $env:VERSION; Runtime = $env:RID; ReleaseNotes = 'notes/notes.md' }
          if ($env:REQUIRE_SIGNING -eq 'true') {
            # An empty -AzureTrustedSignFile packs UNSIGNED with nothing but a vpk warning, and
            # the run would not fail until the smoke job two jobs later. Assert it here instead.
            if (-not $env:SIGN_FILE) { throw 'require-signing is set but SIGN_FILE is empty' }
            $packArgs['AzureTrustedSignFile'] = $env:SIGN_FILE
          }
          ./windows/scripts/package.ps1 @packArgs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: velopack-${{ matrix.rid }}
          path: windows/artifacts/${{ matrix.rid }}
          if-no-files-found: error
          # ~145 MB per RID. The published release is the durable copy of these files;
          # the artifact only has to outlive the smoke and publish jobs and any re-run.
          retention-days: 14

  smoke:
    name: Install and launch (win-x64)
    needs: package
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: velopack-win-x64
          path: artifacts

      # Only the signature check below reads the arm64 package; skip the ~145 MB otherwise.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.require-signing
        with:
          name: velopack-win-arm64
          path: artifacts-arm64

      # With require-signing, -ExpectSigned demands that Setup.exe and the installed exe carry a
      # valid Authenticode signature, or this job — and therefore the release — fails.
      - name: Silent install, launch, first-run checks
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          REQUIRE_SIGNING: ${{ inputs.require-signing }}
        run: |
          $signed = @{}
          if ($env:REQUIRE_SIGNING -eq 'true') { $signed['ExpectSigned'] = $true }
          ./windows/scripts/smoke-test.ps1 -SetupExe (Resolve-Path artifacts/ConnectorControl-win-x64-Setup.exe).Path -Version $env:VERSION -Channel win-x64 -Seconds 20 -LogDir "$env:RUNNER_TEMP/smoke-logs" @signed

      # The arm64 package cannot be installed on this x64 runner; its signature can be checked.
      - name: arm64 Setup.exe signature
        if: inputs.require-signing
        shell: pwsh
        run: ./windows/scripts/smoke-test.ps1 -SignatureOnly -SetupExe (Resolve-Path artifacts-arm64/ConnectorControl-win-arm64-Setup.exe).Path

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore

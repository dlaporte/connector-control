# Keeps the SHA-pinned actions in .github/workflows current. Every `uses:` is pinned to a
# commit (with the version in a trailing comment, which Dependabot updates too), so a
# floating major tag can never pull a changed action into the job that holds the signing
# keys; this is what turns those pins over.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
